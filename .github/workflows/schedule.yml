name: scheduled-tasks

on:
  schedule:
    # 每小時一次（GitHub schedule 為 best-effort，實際觸發可能延遲或偶有跳過）。
    - cron: "25 * * * *"
  workflow_dispatch: {} # 允許手動觸發

permissions:
  contents: write # 允許把更新後的 state/ commit 回 repo

concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all tasks
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python run_all.py

      - name: Commit updated state & report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ inventory_report.md
          if git diff --staged --quiet; then
            echo "state/報告 無變化，不需 commit"
          else
            git commit -m "chore: update task state & inventory report [skip ci]"
            git push
          fi
