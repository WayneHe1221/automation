name: scheduled-tasks

on:
  schedule:
    # 每小時一次（GitHub schedule 為 best-effort，實際觸發可能延遲或偶有跳過）。
    - cron: "25 * * * *"
  workflow_dispatch: {} # 允許手動觸發

permissions:
  contents: write # 允許把更新後的 state/ commit 回 repo

concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Run all tasks
        id: scheduled_tasks
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python run_all.py

      - name: Commit updated state & report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ inventory_report.md
          if git diff --staged --quiet; then
            echo "state/報告 無變化，不需 commit"
          else
            git commit -m "chore: update task state & inventory report [skip ci]"
            git push
          fi

      - name: Report task failure
        if: steps.scheduled_tasks.outcome == 'failure'
        run: |
          echo "One or more scheduled tasks failed. Successful task state was still saved."
          exit 1

  sync-firestore:
    needs: run
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase project settings are incomplete."
            exit 1
          fi
          umask 077
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          GOOGLE_APPLICATION_CREDENTIALS="$credential_file" python tasks/firebase_sync.py
